services:
  db:
    image: postgres:16.3-alpine
    container_name: oddsedgex-app_db
    environment:
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_USER: "${DB_USERNAME}"
      POSTGRES_DB: "${DB_DATABASE}"
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - 'oddsedgex-app:/var/lib/postgresql/data'
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 1s
      timeout: 5s
      retries: 10
    networks:
      - oddsedgex-app

networks:
  oddsedgex-app:
    driver: bridge

volumes:
  oddsedgex-app:
    driver: local
